[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnm-al"
version = "0.1.0"
description = "Active learning of regime maps for pore-network (karst) simulations on Slurm"
requires-python = ">=3.11"
# exact versions are pinned in requirements.txt (setup_msi.sh installs those, then this package with --no-deps)
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
tabicl = ["tabicl"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["pnm_al*", "tasks*"]
